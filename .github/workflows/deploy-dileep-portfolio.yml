name: Deploy Dileep Portfolio

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Fix GitHub Pages project-site asset paths
        shell: bash
        run: |
          find . -type f \( -name '*.js' -o -name '*.css' -o -name '*.html' \) -print0 | xargs -0 perl -pi -e 's#(["\x27])/(textures|sounds|fonts|images|cursors)/#$1./$2/#g; s#(["\x27])/(resume\.pdf|favicon\.svg)#$1./$2#g; s#url\(/(textures|sounds|fonts|images|cursors)/#url(./$1/#g; s#url\(/(resume\.pdf|favicon\.svg)#url(./$1#g'

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
