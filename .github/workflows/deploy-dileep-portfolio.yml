name: Deploy Dileep Portfolio

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout clean portfolio
        uses: actions/checkout@v4

      - name: Fix project-site asset URLs
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root = Path('.')
          prefixes = ('textures/', 'sounds/', 'fonts/', 'images/', 'cursors/')
          files = list(root.rglob('*.js')) + list(root.rglob('*.css')) + list(root.rglob('*.html'))
          for path in files:
              if '.git' in path.parts:
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except (UnicodeDecodeError, OSError):
                  continue
              original = text
              for prefix in prefixes:
                  text = text.replace(f'/{prefix}', f'/My_Protofolio/{prefix}')
              for name in ('resume.pdf', 'favicon.svg', 'favico.png'):
                  text = text.replace(f'/{name}', f'/My_Protofolio/{name}')
              if text != original:
                  path.write_text(text, encoding='utf-8')
          PY

      - name: Verify clean portfolio
        shell: bash
        run: |
          test -f index.html
          test -f assets/index-C4cy74I0.js
          test -f assets/index-CnIF8Z0a.css
          test -f textures/entrance/floor_paper.webp
          test -f fonts/CabinSketch-Bold.ttf
          test -f fonts/CabinSketch-Regular.ttf
          test -f sounds/papersound.mp3
          echo 'Clean portfolio verified.'

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload clean portfolio
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
